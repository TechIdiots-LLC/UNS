name: Build and Release

on:
  workflow_dispatch:
  push:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  version-check:
    name: Check version
    runs-on: ubuntu-latest
    outputs:
      version:   ${{ steps.check.outputs.version }}
      published: ${{ steps.check.outputs.published }}

    steps:
      - uses: actions/checkout@v4

      - name: Read VERSION and check GitHub releases
        id: check
        run: |
          VERSION=$(cat VERSION | tr -d '[:space:]')

          # Guard against tagging garbage. Without this, an empty or malformed VERSION
          # file silently produces a tag literally named "v" (see the stray v tag this
          # repo picked up early on) instead of failing the run.
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "::error::VERSION does not contain a valid semver version (got: '${VERSION}')"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/v${VERSION}" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}")

          if [ "$HTTP_STATUS" = "200" ]; then
            echo "published=true"  >> "$GITHUB_OUTPUT"
            echo "v${VERSION} is already published — skipping release."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "v${VERSION} is not yet published — proceeding."
          fi

  package:
    name: Package release archives
    runs-on: ubuntu-latest
    needs: version-check
    if: needs.version-check.outputs.published == 'false'

    steps:
      - uses: actions/checkout@v4

      - name: Archive the repo (zip + tar.gz)
        run: |
          VERSION="${{ needs.version-check.outputs.version }}"
          git archive --format=zip    -o "uns-${VERSION}.zip"    --prefix="uns-${VERSION}/" HEAD
          git archive --format=tar.gz -o "uns-${VERSION}.tar.gz" --prefix="uns-${VERSION}/" HEAD

      - name: Upload release archives
        uses: actions/upload-artifact@v4
        with:
          name: release-archives
          path: |
            uns-*.zip
            uns-*.tar.gz
          retention-days: 7

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [version-check, package]
    if: needs.version-check.outputs.published == 'false'

    steps:
      - uses: actions/checkout@v4

      - name: Download release archives
        uses: actions/download-artifact@v4
        with:
          name: release-archives
          path: artifacts/

      - name: Extract changelog for version
        run: |
          VERSION="${{ needs.version-check.outputs.version }}"
          if [ -f CHANGELOG.md ]; then
            awk -v ver="## $VERSION" \
              'BEGIN{p=0} $0==ver{p=1;next} /^## /&&p{exit} p{print}' \
              CHANGELOG.md > release-notes.md
          else
            echo "Release v${VERSION}." > release-notes.md
          fi
          cat release-notes.md

      - name: Publish GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag:          v${{ needs.version-check.outputs.version }}
          name:         v${{ needs.version-check.outputs.version }}
          # Only used when the tag does not already exist - pins a freshly created tag to
          # the commit actually being packaged. An existing tag is NOT moved, so to
          # re-release a version you must delete the old tag as well as the release.
          commit:       ${{ github.sha }}
          bodyFile:     release-notes.md
          artifacts:    "artifacts/*.zip,artifacts/*.tar.gz"
          draft:        false
          allowUpdates: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
